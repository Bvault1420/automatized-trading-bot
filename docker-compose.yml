services:
  aegis:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      BIND_HOST: "0.0.0.0"
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Optional: docker compose --profile public up -d
  # Schnell-Tunnel, Hostname steht in den cloudflared-Logs (ändert sich nach Neustart).
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://aegis:8787"]
    depends_on:
      aegis:
        condition: service_healthy
